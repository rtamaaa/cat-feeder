name: Build iOS App (kivy-ios)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Tools
        run: |
          brew install autoconf automake libtool pkg-config
          python -m pip install --upgrade pip setuptools wheel
          pip install cython kivy-ios

      - name: Build Recipes with kivy-ios
        run: |
          toolchain build python3 kivy requests urllib3 certifi charset_normalizer idna

      - name: Create Xcode Project
        run: |
          toolchain create SmartCatFeeder app/frontend

      - name: Archive Xcode Project
        run: |
          zip -r SmartCatFeeder-iOS-XcodeProject.zip smartcatfeeder-ios/

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCatFeeder-iOS-Project
          path: SmartCatFeeder-iOS-XcodeProject.zip
          retention-days: 14
