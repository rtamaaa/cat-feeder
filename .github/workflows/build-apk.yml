name: Build Android APK (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libstdc++6 libgtk-3-dev build-essential ccache

      - name: Install Python Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "cython<3.0" "buildozer>=1.5.0" "kivy>=2.2.0"

      - name: Build APK with Buildozer
        run: |
          cd app/frontend
          # Pastikan file buildozer.spec ada
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCatFeeder-Android-APK
          path: app/frontend/bin/*.apk
          retention-days: 30
